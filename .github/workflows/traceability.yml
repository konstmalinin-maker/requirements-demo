name: Traceability Check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: traceability-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: tests-and-traceability
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - name: Ruff
        run: python -m ruff check src tests scripts
      - name: Commitlint
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
          else
            git log -1 --format=%B "$HEAD_SHA" | npx commitlint --verbose
          fi
      - name: Tests and coverage threshold
        run: >-
          python -m pytest tests/ -v --cov=src --cov-fail-under=80
          --cov-report=term-missing --cov-report=json:coverage.json
          --cov-report=xml:coverage.xml --cov-report=html:htmlcov
          --junitxml=junit.xml
      - name: Generate RTM from actual history
        if: ${{ !cancelled() && success() }}
        run: python scripts/generate_rtm.py
      - name: Verify forward and reverse traceability
        if: ${{ !cancelled() && success() }}
        run: python scripts/check_traceability.py
      - name: Verify requirement versions
        if: ${{ !cancelled() && success() }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            python scripts/check_requirement_versions.py --base "$BASE_SHA"
          else
            python scripts/check_requirement_versions.py --base HEAD
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ github.run_id }}
          path: |
            docs/traceability.md
            docs/traceability-report.md
            coverage.json
            coverage.xml
            htmlcov/
            junit.xml
          if-no-files-found: warn
      - name: Explain failed PR checks
        if: ${{ github.event_name == 'pull_request' && failure() }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `❌ Проверка требований не пройдена. Проверьте формат коммитов, покрытие ≥80%, прямую/обратную трассируемость и версии требований. [Журнал CI](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`
            });
  publish-rtm:
    name: regenerate-and-commit-rtm
    needs: verify
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/generate_rtm.py && python scripts/check_traceability.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(rtm): regenerate requirement matrix (BR-003)'
          file_pattern: 'docs/traceability.md docs/traceability-report.md'
