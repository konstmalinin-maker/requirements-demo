name: Label requirement issues
on:
  issues:
    types: [opened, edited]
permissions:
  contents: read
  issues: write
jobs:
  requirement-label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const match = issue.title.match(/^\[((?:BR|UR|FR|NFR)-\d{3})\]/);
            if (!match) return;
            const id = match[1];
            const files = { BR: 'business.md', UR: 'user.md', FR: 'functional.md', NFR: 'non-functional.md' };
            const path = `docs/requirements/${files[id.split('-')[0]]}`;
            const params = { owner: context.repo.owner, repo: context.repo.repo };
            const response = await github.rest.repos.getContent({ ...params, path, ref: 'main' });
            const text = Buffer.from(response.data.content, 'base64').toString('utf8');
            const definition = new RegExp(`^## ${id}@v(\\d+):`, 'm').exec(text);
            if (!definition) { core.setFailed(`Requirement ${id} is not defined in SRS`); return; }
            const label = `req: ${id}`;
            try { await github.rest.issues.getLabel({ ...params, name: label }); }
            catch (error) {
              if (error.status !== 404) throw error;
              try { await github.rest.issues.createLabel({ ...params, name: label, color: '1d76db', description: `SRS ${id}` }); }
              catch (createError) { if (createError.status !== 422) throw createError; }
            }
            const existing = issue.labels.map(x => typeof x === 'string' ? x : x.name);
            for (const old of existing.filter(x => /^req: (BR|UR|FR|NFR)-\d{3}$/.test(x) && x !== label)) {
              await github.rest.issues.removeLabel({ ...params, issue_number: issue.number, name: old });
            }
            await github.rest.issues.addLabels({ ...params, issue_number: issue.number, labels: [label] });
            const anchor = `${id.toLowerCase()}v${definition[1]}`;
            const url = `https://github.com/${params.owner}/${params.repo}/blob/main/${path}`;
            const marker = '<!-- requirement-link -->';
            const body = `${marker}\nТребование **${id}@v${definition[1]}**: [открыть SRS](${url}).\nМетка **${label}** добавлена автоматически GitHub Actions.`;
            const comments = await github.paginate(github.rest.issues.listComments, { ...params, issue_number: issue.number });
            const previous = comments.find(x => x.user.type === 'Bot' && x.body.includes(marker));
            if (previous) await github.rest.issues.updateComment({ ...params, comment_id: previous.id, body });
            else await github.rest.issues.createComment({ ...params, issue_number: issue.number, body });
