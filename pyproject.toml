[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "requirements-demo"
version = "1.0.0"
requires-python = ">=3.12"
description = "Requirements-as-code: локальный менеджер заметок"

[project.scripts]
note = "src.cli:entrypoint"

[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-data]
src = ["messages_ru.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
junit_family = "xunit1"
markers = ["req(*ids): links a collected test to stable requirement IDs"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 100
